<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:radial-gradient(circle at 10% 10%,#fff2c9 0,transparent 28%),radial-gradient(circle at 90% 20%,#d9f8ff 0,transparent 30%),linear-gradient(135deg,#fff5fb,#f0f0ff 55%,#e7fff7);color:#20213b;min-height:100vh;padding:18px}.wrap{max-width:760px;margin:0 auto}.card{background:#fff;border:3px solid #fff;border-radius:28px;padding:clamp(20px,5vw,42px);box-shadow:0 18px 45px #3d367018}.tag{display:inline-block;background:#f0eaff;color:#6652d9;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:900}h1{font-size:clamp(30px,6vw,48px);line-height:1.15;margin:16px 0}p{line-height:1.7;color:#68708a}.btn{border:0;border-radius:16px;padding:16px 22px;background:linear-gradient(90deg,#7461f2,#9c64ef);color:white;font-weight:900;font-size:17px;cursor:pointer;width:100%;margin-top:18px}.btn.secondary{background:#f1efff;color:#5245bd}.progress{height:12px;background:#eeeefa;border-radius:20px;margin:16px 0;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ff9fba,#8c70f5,#48d9ba);width:0;transition:.25s;border-radius:20px}.choice{display:block;text-align:left;width:100%;border:2px solid #e9e8f5;background:#fff;border-radius:18px;padding:18px;margin:12px 0;font-size:16px;cursor:pointer;color:#20213b}.choice:hover{border-color:#8d79f4;background:#f8f5ff}.small{font-size:13px;color:#8a8ca4}.result{font-size:clamp(30px,6vw,44px);font-weight:1000;margin:12px 0;color:#7055e8}.pill{display:inline-block;padding:8px 12px;border-radius:20px;background:#e8faf4;color:#087b61;font-weight:800;margin:4px}.hide{display:none}.hero-emoji{font-size:clamp(60px,15vw,100px);text-align:center;margin:12px 0}.q-emoji{font-size:42px;margin:10px 0}.bubble{background:#fff5d9;color:#916300;border-radius:16px;padding:10px 14px;font-weight:800;display:inline-block;margin:8px 0}
</style></head><body><main class="wrap"><section class="card" id="start"><div class="hero-emoji">🧭✨</div><span class="tag">WORK TYPE 16</span><h1>あなたに向いてる<br>就職先診断</h1><div class="bubble">🎮 12問であなたの仕事タイプがわかる！</div><p>簡単な質問に答えるだけで、あなたの仕事タイプと相性のよい職種・働き方がわかる！<br>直感で選んでね。所要時間は約2分。</p><p class="small">※診断結果は自己理解のヒントです。職業選択を決めつけるものではありません。</p><button class="btn" id="startBtn">診断スタート →</button></section>
<section class="card hide" id="quiz"><div class="small" id="count"></div><div class="q-emoji" id="qemoji">🌟</div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="answers"></div><button class="btn secondary" id="back">← 前の質問</button></section>
<section class="card hide" id="result"><div class="hero-emoji">🎉🏆🎉</div><span class="tag">あなたの診断結果</span><div class="result" id="type"></div><h2 id="name"></h2><p id="desc"></p><h3>向いている職種の例</h3><div id="jobs"></div><h3>あなたの強み</h3><p id="strength"></p><h3>就活アドバイス</h3><p id="advice"></p><button class="btn" id="again">もう一度診断する</button></section></main>
<script>
const qs=[
["初めての人が多いグループに参加。あなたは？",["自分から話しかけて輪を広げる","まず周りを観察し、話しやすい人と話す"],0],
["仕事で相談したいことがあるときは？",["人に話すことで考えがまとまる","一度自分で整理してから相談する"],0],
["休日の過ごし方で充電できるのは？",["友人や人と出かける・交流する","一人の時間や少人数でゆっくりする"],0],
["会議や話し合いでは？",["話しながらアイデアを出すことが多い","考えてから、必要なことを話す"],0],
["知らない人との交流イベント。気持ちは？",["新しい出会いが楽しみ","少し緊張するが、目的があれば参加する"],0],
["仕事の予定はどうしたい？",["先に計画・順番を決めておきたい","状況に合わせて柔軟に変えたい"],1],
["課題や提出物は？",["早めに着手し、余裕を持って仕上げる","締切が近づくと集中力が上がる"],1],
["旅行やイベントの準備は？",["行程や必要なものを事前に決める","大枠だけ決めて、現地で楽しむ"],1],
["急な予定変更が起きたら？",["まず予定を整理し、代案を立てたい","その場で臨機応変に対応できる"],1],
["仕事の達成感が大きいのは？",["計画通りに完了し、成果が整ったとき","新しい発見や予想外の展開があったとき"],1],
["チームで意見が割れたとき、重視するのは？",["根拠・効率・筋が通っているか","相手の気持ち・関係性・納得感"],2],
["後輩にアドバイスするとしたら？",["改善点を具体的に伝えるのが親切","まず努力や気持ちを受け止めて伝える"],2],
["重要な判断をするときは？",["公平さと合理性を優先する","人への影響や価値観を考慮する"],2],
["褒められてうれしい言葉は？",["『判断が的確』『仕事ができる』","『気が利く』『安心して相談できる』"],2],
["誰かが失敗したときは？",["原因と再発防止策を考える","本人の気持ちを支え、立ち直りを助ける"],2],
["新しい仕事を覚えるなら？",["実例・手順・具体的な説明がほしい","目的や全体像、応用の可能性を知りたい"],3],
["仕事で興味を持つのは？",["今ある仕組みを改善し、確実に役立てる","まだない仕組みや未来の可能性を考える"],3],
["説明を聞くとき、分かりやすいのは？",["具体例・数字・現場の話","比喩・概念・全体のつながり"],3],
["得意だと感じるのは？",["細かい違いや現実的な課題に気づく","パターンや新しいアイデアを見つける"],3],
["仕事の面白さを感じるのは？",["目に見える成果を積み上げる","新しい可能性を探り、未来を形にする"],3]
];
const types={
ESTJ:{label:"組織を動かすリーダー系",emoji:"🦁",name:"まとめ役のライオン隊長",desc:"目標を定め、役割や手順を整え、チームを前に進めるのが得意なタイプ。責任を引き受け、決めたことを実行に移す力があります。曖昧な状況より、目的・期限・担当が明確な環境で力を発揮しやすいでしょう。",jobs:["営業管理","店長・店舗運営","生産管理","施工管理","総務・管理部門","プロジェクトリーダー"],strength:"段取り、責任感、決断力、進捗管理。周囲に方向性を示し、実行を後押しできます。",caution:"効率を優先しすぎると、周囲のペースや感情を見落とすことも。相手の意見を聞く時間を取ると、さらに信頼されます。",env:"目標や評価基準が明確で、チームをまとめたり改善したりできる職場。"},
ESTP:{label:"行動・現場チャレンジ系",emoji:"🐯",name:"即行動のトラ冒険家",desc:"考え込むより、まず動いて状況をつかむ実践派。変化への対応が早く、人との交渉や現場での判断にも強みがあります。毎日同じ作業を繰り返すより、課題や出会いが次々に変わる仕事で意欲が高まりやすいタイプです。",jobs:["法人・個人営業","販売・接客","イベント運営","観光・旅行","現場スタッフ","起業・新規開拓"],strength:"行動力、交渉力、状況判断、切り替えの速さ。トラブル時にも現実的な対応策を見つけます。",caution:"勢いで進めると確認不足になりやすい面も。重要な契約や安全確認では、チェックリストを活用しましょう。",env:"現場で動ける、成果が見える、裁量と変化がある職場。"},
ESFJ:{label:"人を支える・調整系",emoji:"🐼",name:"みんなの安心パンダ",desc:"周囲の様子に気づき、人が気持ちよく働けるよう調整するタイプ。相手の立場を考え、チームの協力関係をつくるのが得意です。人と関わることや、誰かの役に立っている実感が仕事のモチベーションにつながります。",jobs:["人事・採用","医療事務","福祉・介護","接客・受付","教育支援","総務"],strength:"気配り、協調性、連絡調整、信頼関係づくり。チームの困りごとを早めに察知できます。",caution:"頼まれごとを抱え込みがち。自分の負担や優先順位も伝えることが、長く活躍するコツです。",env:"人との交流があり、協力や支援が評価される職場。"},
ESFP:{label:"人を楽しませる・体験系",emoji:"🦊",name:"笑顔を届けるキツネ",desc:"人と接することや、その場を明るくすることが好きなタイプ。相手の反応を見ながら柔軟に対応し、楽しい体験を生み出す力があります。人の表情や空気感を感じ取れるため、接客や表現の場で魅力が出やすいでしょう。",jobs:["観光・ホテル","販売・接客","美容・ブライダル","広報・SNS運用","イベント企画","飲食サービス"],strength:"親しみやすさ、表現力、臨機応変さ、場を盛り上げる力。",caution:"細かい事務や長期計画が後回しになりやすい場合も。小さな締切やタスク管理を使うと安定します。",env:"人と関わり、反応や成果を感じられる職場。"},
ENTJ:{label:"戦略・経営リーダー系",emoji:"🦅",name:"未来を切り開くワシ",desc:"大きな目標から逆算し、課題を整理して人や資源を動かすタイプ。改善点を見つけ、成果につながる仕組みを考えることが得意です。責任ある役割や、自分の判断が結果に反映される仕事にやりがいを感じやすいでしょう。",jobs:["経営企画","事業企画","コンサルタント","営業企画・管理","プロジェクト管理","起業"],strength:"戦略性、推進力、判断力、目標達成への集中力。",caution:"スピードや成果を求めすぎると、周囲がついて来られないことも。対話と育成も意識すると強いリーダーになります。",env:"裁量が大きく、改善や意思決定に関われる職場。"},
ENTP:{label:"企画・アイデア開拓系",emoji:"🐙",name:"ひらめき発明オクトパス",desc:"『もっと面白い方法があるのでは？』と可能性を探すアイデア型。既存のルールを別の角度から見たり、複数の案を組み合わせたりするのが得意です。新しい企画や課題解決など、変化と知的刺激がある環境で力が出やすいでしょう。",jobs:["商品・サービス企画","マーケティング","広告・広報","新規事業","コンサルタント","IT企画"],strength:"発想力、議論力、好奇心、課題の再定義。",caution:"アイデアが増えて完成まで届かないことも。優先順位を決め、最後まで仕上げる仕組みをつくりましょう。",env:"提案を歓迎し、試行錯誤や変化を楽しめる職場。"},
ENFJ:{label:"育成・人材サポート系",emoji:"🐬",name:"成長を応援するイルカ",desc:"人の可能性や得意なことを見つけ、前向きな成長を支えるタイプ。相手の気持ちをくみ取りながら、チームをまとめたり目標に向けて励ましたりできます。人の成長が見える仕事に大きな充実感を得やすいでしょう。",jobs:["教育・講師","人事・採用","キャリア支援","営業","福祉・相談支援","チームマネジメント"],strength:"共感力、育成力、伝える力、周囲を巻き込む力。",caution:"他人の課題まで背負ってしまうことがあります。支援する範囲と自分の休息を大切に。",env:"人の成長やチームづくりに関われる職場。"},
ENFP:{label:"人・アイデア・創造系",emoji:"🦋",name:"可能性を広げるチョウ",desc:"好奇心旺盛で、人やアイデアから刺激を受けるタイプ。新しい企画を考えたり、相手の魅力を見つけたりすることが得意です。自由に発想できる環境や、自分の仕事が誰かの心を動かす場面で意欲が高まりやすいでしょう。",jobs:["広報・PR","広告・コンテンツ制作","採用・人事","企画・イベント","ライター","教育・支援"],strength:"創造力、共感性、熱意、コミュニケーション力。",caution:"興味が移りやすく、地道な作業が負担になることも。小さな目標を設定して進めると強みが活きます。",env:"自由度があり、人や新しい企画に関われる職場。"},
ISTJ:{label:"正確・安定・管理系",emoji:"🐢",name:"信頼を積み重ねるカメ",desc:"決められた手順を守り、正確に仕事を積み重ねる堅実タイプ。責任感が強く、細部の確認や継続的な作業が得意です。安定した業務や専門知識を身につける仕事で、周囲から頼られる存在になりやすいでしょう。",jobs:["経理・会計","品質管理","一般事務","公務員","法務・労務補助","製造・検査"],strength:"正確性、継続力、誠実さ、記録・管理能力。",caution:"変化が急な環境では慎重になりやすい面も。変更の理由や目的を確認すると安心して対応できます。",env:"手順や役割が明確で、丁寧さや専門性が評価される職場。"},
ISTP:{label:"技術・分析・問題解決系",emoji:"🦉",name:"仕組みを解くフクロウ",desc:"物事の仕組みを冷静に観察し、原因を見つけて解決するタイプ。実際に手を動かして試すことや、技術を磨くことに集中できます。感情的な議論より、具体的な課題と解決策に向き合う仕事で力を発揮しやすいでしょう。",jobs:["機械・電気技術","ITエンジニア","整備・保守","品質技術","設備管理","データ分析"],strength:"分析力、技術習得、冷静さ、トラブル対応。",caution:"考えや成果を周囲に共有するのが少なめになりがち。途中経過を伝えると協力を得やすくなります。",env:"専門技術を磨き、実践的な課題を解決できる職場。"},
ISFJ:{label:"丁寧・安心サポート系",emoji:"🐰",name:"細やかに支えるウサギ",desc:"相手の困りごとや細かな変化に気づき、丁寧に支えるタイプ。目立つことより、誰かが安心して過ごせる環境をつくることに価値を感じます。手順を守りながら、誠実に仕事を続ける力が強みです。",jobs:["医療・福祉","一般事務","総務・庶務","受付","教育支援","図書館・公共サービス"],strength:"気配り、丁寧さ、責任感、継続的なサポート。",caution:"人に合わせて無理をしやすい傾向も。困ったときに相談できる体制がある職場を選びましょう。",env:"安定したチームで、支援や丁寧さが大切にされる職場。"},
ISFP:{label:"感性・ものづくり系",emoji:"🐱",name:"感性を形にするネコ",desc:"自分の感覚や美意識を大切にし、目の前のものを丁寧に仕上げるタイプ。相手の気持ちや雰囲気を感じ取り、言葉以外の表現にも強みがあります。実際に作品や成果物をつくる仕事で満足感を得やすいでしょう。",jobs:["デザイン・制作","美容・ファッション","調理・製菓","写真・映像","ものづくり","動物関連"],strength:"感性、観察力、丁寧さ、柔軟な対応。",caution:"自分の希望を遠慮して伝えられないことも。仕事内容や条件を言葉にして確認する習慣を。",env:"個性や品質を尊重し、手を動かして成果をつくれる職場。"},
INTJ:{label:"分析・戦略設計系",emoji:"🦊",name:"未来を設計するキツネ",desc:"複雑な情報を整理し、長期的な視点から最適な仕組みを考えるタイプ。表面的な問題だけでなく、根本原因や将来への影響を見ようとします。深く考える時間があり、専門性や計画力を活かせる仕事に向いています。",jobs:["データ分析","IT・システム設計","研究開発","経営・事業企画","建築・設計","コンサルタント"],strength:"論理的思考、戦略性、計画力、独立して考える力。",caution:"完成度を求めすぎたり、他人にも同じ基準を期待したりすることがあります。途中段階で共有することも大切です。",env:"集中して考えられ、改善や設計に関われる職場。"},
INTP:{label:"研究・論理探究系",emoji:"🧪",name:"謎を追うラボネコ",desc:"『なぜそうなるのか』を掘り下げ、理論や仕組みを理解する探究タイプ。疑問を放置せず、独自の視点で考えることが得意です。答えが一つではない問題や、専門知識を深める仕事に興味を持ちやすいでしょう。",jobs:["研究職","プログラマー","データサイエンティスト","技術開発","大学・教育研究","システム分析"],strength:"探究心、論理性、独創的な発想、概念理解。",caution:"考えることに夢中で、期限や実行が後回しになる場合も。小さく試して形にする習慣が役立ちます。",env:"知的好奇心を満たし、集中して分析・研究できる職場。"},
INFJ:{label:"社会貢献・理念サポート系",emoji:"🦌",name:"想いをつなぐシカ",desc:"人の気持ちや社会の課題を深く考え、意味のある仕事をしたいタイプ。表面の出来事だけでなく、背景や将来を想像する力があります。自分の価値観と仕事の目的がつながると、粘り強く取り組めるでしょう。",jobs:["福祉・相談支援","教育","人事・組織開発","編集・ライター","NPO・社会事業","キャリア支援"],strength:"洞察力、共感性、価値観を軸に考える力、粘り強さ。",caution:"理想と現実の差に疲れたり、人の悩みを抱え込んだりすることも。境界線や休息を大切に。",env:"仕事の意義が明確で、人や社会に貢献できる職場。"},
INFP:{label:"表現・価値観クリエイティブ系",emoji:"🌷",name:"想いを描く花の妖精",desc:"自分の価値観や想像力を大切にし、心から納得できる仕事を探すタイプ。人の気持ちや物語に共感し、独自の表現で伝えることが得意です。自分らしさを活かせるテーマや、誰かの役に立つ創作に魅力を感じやすいでしょう。",jobs:["ライター・編集","デザイン・イラスト","コンテンツ制作","教育・福祉","企画・広報","文化・出版関連"],strength:"想像力、共感性、表現力、誠実さ。",caution:"理想を大切にする分、条件面や現実的な選択に迷うことも。仕事内容・待遇・働き方を具体的に比べてみましょう。",env:"価値観や個性を尊重し、表現や創造性を活かせる職場。"}
};
let idx=0,scores=[0,0,0,0],answers=[];
function show(id){["start","quiz","result"].forEach(x=>document.getElementById(x).classList.toggle("hide",x!==id))}
function start(){idx=0;scores=[0,0,0,0];answers=[];show("quiz");render()}
function render(){document.getElementById("count").textContent="QUESTION "+(idx+1)+" / "+qs.length;document.getElementById("bar").style.width=((idx+1)/qs.length*100)+"%";document.getElementById("question").textContent=qs[idx][0];document.getElementById("qemoji").textContent=["👋","🗣️","🌿","💬","🎉","📅","⏳","🧳","🔄","🏁","⚖️","🌱","🧭","💖","🤲","🧩","🚀","📚","🔍","✨"][idx];let a=document.getElementById("answers");a.innerHTML="";qs[idx][1].forEach((txt,n)=>{let b=document.createElement("button");b.className="choice";b.textContent=(n===0?"🌞 ":"🌙 ")+txt;b.onclick=()=>{answers[idx]=n;idx++;if(idx===qs.length)finish();else render()};a.appendChild(b)});document.getElementById("back").style.visibility=idx===0?"hidden":"visible"}
function finish(){scores=[0,0,0,0];answers.forEach((n,i)=>scores[qs[i][2]]+=(n===0?1:-1));const code=(scores[0]>=0?"E":"I")+(scores[3]>=0?"S":"N")+(scores[2]>=0?"T":"F")+(scores[1]>=0?"J":"P");const t=types[code];document.getElementById("type").textContent=t.label;document.getElementById("name").textContent=t.emoji+" "+t.name;document.getElementById("desc").textContent=t.desc;document.getElementById("jobs").innerHTML=t.jobs.map(x=>'<span class="pill">'+x+'</span>').join("");document.getElementById("strength").textContent=t.strength;document.getElementById("advice").textContent=t.caution+" "+t.env;show("result")}
document.getElementById("startBtn").addEventListener("click",start);document.getElementById("back").addEventListener("click",()=>{if(idx>0){idx--;render()}});document.getElementById("again").addEventListener("click",()=>show("start"));
</script></body></html>
